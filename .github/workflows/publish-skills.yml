name: Publish Skills

on:
  push:
    branches: [main]
    paths:
      - 'agents-docs/content/**'
      - 'agents-docs/_snippets/**'
      - 'agents-docs/skills-collections/_templates/**'
      - 'agents-docs/scripts/generate-skill-collections.ts'
      - 'agents-docs/skills-collections/README.md'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agents repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installing pnpm
        id: pnpm-setup
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        continue-on-error: true
        timeout-minutes: 2
        with:
          install: false
      - name: Waiting before retrying the pnpm download
        if: steps.pnpm-setup.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::pnpm-setup-retry=started. The first pnpm/setup attempt failed or hit its 2-minute bound; its error is in the Installing pnpm step. Retrying once in 20s."
          sleep 20
      - name: Installing pnpm (retry after a failed download)
        id: pnpm-setup-retry
        if: steps.pnpm-setup.outcome == 'failure'
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        timeout-minutes: 2
        with:
          install: false
      - name: Recording the pnpm download retry result
        if: ${{ !cancelled() && steps.pnpm-setup.outcome == 'failure' }}
        shell: bash
        env:
          RETRY_OUTCOME: ${{ steps.pnpm-setup-retry.outcome }}
        run: |
          if [[ "$RETRY_OUTCOME" == success ]]; then
            echo "::notice::pnpm-setup-retry=recovered. The first pnpm/setup attempt failed and the retry installed pnpm."
          else
            echo "::error::pnpm-setup-retry=exhausted retry=${RETRY_OUTCOME}. Both pnpm/setup attempts failed; their errors are in the two Installing pnpm steps."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate skill collections
        working-directory: agents-docs
        run: pnpm generate-skill-collections

      - name: Push to skills repo
        uses: cpina/github-action-push-to-another-repository@55306faa4ed53b815ae49e564af8cfb359d32ae2 # main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SKILLS_DEPLOY_KEY }}
        with:
          source-directory: 'agents-docs/skills-collections/.generated'
          destination-github-username: 'inkeep'
          destination-repository-name: 'skills'
          user-email: 'support@inkeep.com'
          target-branch: main
          commit-message: 'chore: update skills from agents repo (${{ github.sha }})'
