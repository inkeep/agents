name: Auto Format

on:
  pull_request:
    branches: ["*"]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auto-format:
    # On PRs: skip forks (can't push back), changeset release PRs (machine-generated),
    # and Dependabot PRs. Dependabot-triggered workflows cannot read the internal
    # app token secrets used for formatter pushes.
    # On push to main: always run.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref != 'changeset-release/main' &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check if PR is still open
        if: github.event_name == 'pull_request'
        id: pr-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_STATE=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --json state --jq '.state')
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "PR is $PR_STATE — skipping auto-format (branch likely deleted)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.pr-check.outputs.skip != 'true'
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          # On PRs, check out the PR branch so we push back to it.
          # On push, check out the default ref (main).
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log checkout failure
        if: steps.pr-check.outputs.skip != 'true' && steps.checkout.outcome == 'failure'
        run: |
          echo "::notice::Checkout failed — branch was likely deleted (PR merged). Skipping."

      # Generate a GitHub App token so that auto-commits trigger downstream CI
      # workflows. The default GITHUB_TOKEN's commits are ignored by GitHub to
      # prevent infinite loops.
      - name: Generate GitHub App Token
        id: app-token
        if: steps.pr-check.outputs.skip != 'true' && steps.checkout.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.INTERNAL_CI_APP_ID }}
          private-key: ${{ secrets.INTERNAL_CI_APP_PRIVATE_KEY }}

      - name: Setup Node.js
        if: steps.pr-check.outputs.skip != 'true' && steps.checkout.outcome == 'success'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22.x

      - name: Installing pnpm
        id: pnpm-setup
        if: steps.pr-check.outputs.skip != 'true' && steps.checkout.outcome == 'success'
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        continue-on-error: true
        timeout-minutes: 2
        with:
          install: false
      - name: Waiting before retrying the pnpm download
        if: steps.pnpm-setup.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::pnpm-setup-retry=started. The first pnpm/setup attempt failed or hit its 2-minute bound; its error is in the Installing pnpm step. Retrying once in 20s."
          sleep 20
      - name: Installing pnpm (retry after a failed download)
        id: pnpm-setup-retry
        if: steps.pnpm-setup.outcome == 'failure'
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        timeout-minutes: 2
        with:
          install: false
      - name: Recording the pnpm download retry result
        if: ${{ !cancelled() && steps.pnpm-setup.outcome == 'failure' }}
        shell: bash
        env:
          RETRY_OUTCOME: ${{ steps.pnpm-setup-retry.outcome }}
        run: |
          if [[ "$RETRY_OUTCOME" == success ]]; then
            echo "::notice::pnpm-setup-retry=recovered. The first pnpm/setup attempt failed and the retry installed pnpm."
          else
            echo "::error::pnpm-setup-retry=exhausted retry=${RETRY_OUTCOME}. Both pnpm/setup attempts failed; their errors are in the two Installing pnpm steps."
          fi

      - name: Get pnpm store directory
        if: steps.pr-check.outputs.skip != 'true' && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          STORE_PATH=$(pnpm store path --silent) || exit $?
          if [ -z "$STORE_PATH" ]; then
            printf '%s\n' '::error::pnpm store path returned an empty path' >&2
            exit 1
          fi
          printf 'STORE_PATH=%s\n' "$STORE_PATH" >>"$GITHUB_ENV"

      - name: Prepare directories
        if: steps.pr-check.outputs.skip != 'true' && steps.checkout.outcome == 'success'
        run: |
          mkdir -p agents-docs/.source
          touch agents-docs/.source/index.ts

      - name: Setup pnpm cache
        if: steps.pr-check.outputs.skip != 'true' && steps.checkout.outcome == 'success'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml', 'create-agents-template/pnpm-lock.yaml', 'agents-cookbook/evals/langfuse-dataset-example/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        if: steps.pr-check.outputs.skip != 'true' && steps.checkout.outcome == 'success'
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Run formatter
        if: steps.pr-check.outputs.skip != 'true' && steps.checkout.outcome == 'success'
        run: pnpm format

      - name: Check for changes
        if: steps.pr-check.outputs.skip != 'true' && steps.checkout.outcome == 'success'
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push formatting fixes
        if: steps.pr-check.outputs.skip != 'true' && steps.checkout.outcome == 'success' && steps.changes.outputs.has_changes == 'true'
        env:
          PUSH_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: auto-format with biome"

          # Use GitHub App token so the push triggers downstream CI workflows.
          # The default GITHUB_TOKEN's commits are ignored by GitHub to prevent loops.
          if [ -n "$APP_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          # Verify remote branch still exists before pushing
          if ! git ls-remote --exit-code --heads origin "$PUSH_REF" > /dev/null 2>&1; then
            echo "::notice::Remote branch '$PUSH_REF' no longer exists (PR likely merged). Skipping push."
            exit 0
          fi

          pushed=false
          for i in 1 2 3; do
            if git push; then
              pushed=true
              break
            fi
            if ! git ls-remote --exit-code --heads origin "$PUSH_REF" > /dev/null 2>&1; then
              echo "::notice::Remote branch '$PUSH_REF' was deleted during retry. Skipping."
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "::warning::Push failed, attempting pull --rebase and retry ($i/3)"
              if ! git pull --rebase origin "$PUSH_REF"; then
                echo "::error::Rebase onto '$PUSH_REF' failed on attempt $i/3. The formatting commit was not pushed."
                exit 1
              fi
              sleep $((i * 2))
            fi
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::All 3 push attempts to '$PUSH_REF' failed. The formatting commit was not pushed."
            exit 1
          fi
